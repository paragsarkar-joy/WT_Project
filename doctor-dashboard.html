
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCore - Doctor Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="header">
            <h1>MediCore</h1>
            <p>Doctor Dashboard</p>
        </div>

        <div class="form-container">

            <h2>Welcome, Doctor!</h2>
            <p class="subtitle">Manage patient appointments</p>

            <div class="dashboard-card">
                <h3>Total Appointments</h3>
                <p id="totalAppointments">0</p>
            </div>

            <h2>Patient Appointment Requests</h2>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Department</th>
                            <th>Doctor</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Reason</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="doctorAppointmentList">
                        <tr>
                            <td colspan="7">No appointments found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <button onclick="goDashboard()">Back</button>

        </div>

        <footer>
            © 2026 MediCore Hospital Management System
        </footer>

    </div>

    <script src="doctor-dashboard.js"></script>
</body>
</html>
